name: "CodeQL Security Analysis"

on:
  schedule:
    - cron: '0 3 * * 1'  # Run weekly on Mondays at 3 AM UTC
  workflow_dispatch:
  push:
    branches: [ main ]  # Only run on main branch pushes
    paths:
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/codeql.yml'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]
        # Add 'javascript' if you have significant JS/TS code in library-frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-and-quality
        config: |
          paths-ignore:
            - "**/bin/**"
            - "**/obj/**"
            - "**/TestResults/**"
            - "**/logs/**"
            - "library-frontend/node_modules/**"
            - "library-frontend/build/**"

    - name: Restore .NET dependencies
      if: matrix.language == 'csharp'
      run: dotnet restore LibraryApp.sln

    - name: Build .NET solution
      if: matrix.language == 'csharp'
      run: |
        echo "Building .NET solution for CodeQL analysis..."
        dotnet build LibraryApp.sln --configuration Release --no-restore --verbosity quiet
        
        if [ $? -eq 0 ]; then
          echo "✅ Build completed successfully"
        else
          echo "❌ Build failed - CodeQL analysis may be incomplete"
          # Don't fail here - let CodeQL handle partial analysis
        fi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        # Remove conflicting options that might cause SARIF issues
        output: results
      continue-on-error: true  # Don't fail CI if CodeQL has issues